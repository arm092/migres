[pytest]
# Test discovery
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Timeout for tests (5 minutes default, can be overridden with @pytest.mark.timeout)
timeout = 300

# Coverage options (when using pytest-cov)
# --cov = .
# --cov-report = html
# --cov-report = term-missing

# Markers for test categorization
markers =
    integration: Integration tests that require database connections
    slow: Tests that take a long time to run
    crash: Tests that involve crashing/restarting processes
    network: Tests that simulate network failures
    stress: Stress tests with high load
    notifications: Tests that send notifications
    reliability: Tests that verify system reliability and crash recovery

